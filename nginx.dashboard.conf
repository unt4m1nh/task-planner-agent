server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for the main React app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Obs dashboard served at /obs/
    location /obs/ {
        alias /usr/share/nginx/html/obs/;
        try_files $uri $uri/ /obs/index.html;
    }

    # Proxy API calls to the core service
    location /api/ {
        proxy_pass http://core:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
